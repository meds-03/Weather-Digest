<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      try {
        const storedTheme = localStorage.getItem('weather-theme')
        const preference = storedTheme ? JSON.parse(storedTheme) : 'system'
        const systemPrefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
        const useDarkTheme =
          preference === 'dark' ||
          (preference !== 'light' && systemPrefersDark)
        document.documentElement.classList.toggle('dark', useDarkTheme)
        document.documentElement.style.colorScheme = useDarkTheme ? 'dark' : 'light'
      } catch {
        // The app applies the theme after startup if local storage is unavailable.
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Weather Digest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
